[package]
name = "crowpanel-firmware"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
esp-idf-hal = "=0.45.2"
crc32fast = "1"
esp-idf-svc = "=0.51.0"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "s"
[profile.dev]
opt-level = "z"
debug = true
